name = "omni-remote-cache-worker"
main = "build/worker/shim.mjs"
compatibility_date = "2026-11-01"

[build]
command = "cargo install -q worker-build --locked --version 0.9.0 && worker-build --release"

[[r2_buckets]]
binding = "CACHE_BUCKET"
bucket_name = "omni-remote-cache"

[vars]
API_PREFIX = "/api"
ENABLE_OPENAPI = "false"

# Artifact writes use one conditional R2 put, which stores only if the key is absent
# (RFC 0030 section 4.2). Every entry is buffered in memory first, so keep the cap below.

# Largest accepted artifact in bytes (default 33554432, 32 MiB, because an isolate
# has 128 MB of memory). Larger uploads get 413. Request bodies are also capped by
# your Cloudflare plan (100 MB on Free and Pro, 200 MB on Business).
# A value that is not a plain number of bytes (for example "32MiB") is ignored with
# a warning. 0 rejects every non-empty upload.
# MAX_ARTIFACT_SIZE = "33554432"

# Provide the service configuration (tenants and API keys, same JSON schema as
# orcs.config.json) as a secret:
#   wrangler secret put ORCS_CONFIG

# Optional: read tenants, workspaces, API keys and hook data from your own D1
# schema with your own queries. Set `ORCS_REPOSITORY_CONFIG` (JSON with
# `queries`, and optionally `api_key_hash`, `hooks` and `caching`) and bind a
# D1 database as `DB`. You own the schema and migrations.
# [[d1_databases]]
# binding = "DB"
# database_name = "omni-remote-cache"
# database_id = "<your-d1-database-id>"
