name = "omni-remote-cache-worker"
main = "build/worker/shim.mjs"
compatibility_date = "2026-11-01"

[build]
command = "cargo install -q worker-build --locked --version 0.9.0 && worker-build --release"

[[r2_buckets]]
binding = "CACHE_BUCKET"
bucket_name = "omni-remote-cache"

[vars]
API_PREFIX = "/api"
ENABLE_OPENAPI = "false"

# Provide the service configuration (tenants and API keys, same JSON schema as
# orcs.config.json) as a secret:
#   wrangler secret put ORCS_CONFIG

# Optional: read tenants, workspaces, API keys and hook data from your own D1
# schema with your own queries. Set `ORCS_REPOSITORY_CONFIG` (JSON with
# `queries`, and optionally `api_key_hash`, `hooks` and `caching`) and bind a
# D1 database as `DB`. You own the schema and migrations.
# [[d1_databases]]
# binding = "DB"
# database_name = "omni-remote-cache"
# database_id = "<your-d1-database-id>"
