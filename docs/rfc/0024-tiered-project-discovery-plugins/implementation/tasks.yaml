# Task graph for the RFC 0024 implementation plan.
# One entry = one independently reviewable PR. `deps` are hard prerequisites (merged).
# `touches` are conflict domains: two tasks sharing a domain should not run concurrently
# unless the same worker owns both or they are rebased deliberately (see SCHEDULE.md).
# `kind`: code | spec | doc. Generated views: run `python3 schedule.py`.

domains:
  executor: crates/omni_task_executor (cache_manager.rs, batch_executor.rs)
  glob: crates/omni_glob_config, omni_config_types
  collections: crates/config_utils (list/dict), validators
  config-types: crates/omni_configurations (project/task/cache config types)
  loader: crates/omni_context (project_config_loader.rs, context.rs) and omni_core extension_graph
  extractor: crates/omni_context/project_data_extractor.rs, CacheInfo
  collector: crates/omni_collector, project_hasher.rs
  cache-store: crates/omni_cache (hybrid.rs, traits.rs)
  command: crates/omni_command_config, omni_task_context
  planner: crates/omni_execution_plan, omni_api task ops
  cli: crates/omni_cli_core, omni_mcp_core
  source: crates/omni_remote_source, omni_remote_source_contributors
  discovery: crates/omni_context/project_discovery.rs, omni_configuration_discovery
  capability: crates/omni_capabilities, omni_capability_sys
  plugin-config: crates/omni_plugin_configurations (new)
  plugin-contract: crates/omni_plugin (new)
  plugin-host: crates/omni_plugin_host (new)
  plugin-builtins: crates/omni_plugin_builtins (new)
  plugin-wasm: crates/omni_plugin_runtime_wasm (new)
  docs: docs/ only
  ci: CI workflows, cargo features

