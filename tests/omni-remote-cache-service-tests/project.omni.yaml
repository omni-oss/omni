# yaml-language-server: $schema=https://raw.githubusercontent.com/omni-oss/json-schemas/refs/heads/main/project.json
name: "@omni-oss/omni-remote-cache-service-tests"

extends:
  - "@workspace/omni/presets/ts-lib.omni.yaml"

tasks:
  build:
    enabled: false

  test:service:
    exec: bun x vitest --config ./vitest.config.service.ts run
    max_retries: 5
    retry_interval: 2s
    dependencies:
      - omni_remote_cache_service#build:debug

  # Same specs against the Cloudflare worker under `wrangler dev --local`.
  # Not part of `test`: needs wrangler (downloaded on demand) and network.
  test:service:worker:
    exec: bun x vitest --config ./vitest.config.service.ts run
    env:
      vars:
        REMOTE_CACHE_TEST_TARGET: worker
    cache:
      enabled: false

  test:
    dependencies:
      - test:service

  publish:
    enabled: false

dependencies:
  - omni_remote_cache_service
