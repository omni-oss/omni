# yaml-language-server: $schema=https://raw.githubusercontent.com/omni-oss/json-schemas/refs/heads/main/project.json
name: "@omni-oss/omni-remote-cache-service-tests"

extends:
  - "@workspace/omni/presets/ts-lib.omni.yaml"

tasks:
  build:
    enabled: false

  # Same specs, selected with REMOTE_CACHE_TEST_TARGETS (see src/targets).
  test:service:native:
    exec: bun x vitest --config ./vitest.config.service.ts run
    env:
      vars:
        REMOTE_CACHE_TEST_TARGETS: native
    max_retries: 5
    retry_interval: 2s
    dependencies:
      - omni_remote_cache_service#build:debug

  # Needs wrangler (downloaded on demand) and worker-build.
  test:service:worker:
    exec: bun x vitest --config ./vitest.config.service.ts run
    env:
      vars:
        REMOTE_CACHE_TEST_TARGETS: worker
    max_retries: 5
    retry_interval: 2s
    dependencies:
      - omni_remote_cache_worker#build

  # Variable unset: one run covers every target.
  test:service:
    exec: bun x vitest --config ./vitest.config.service.ts run
    max_retries: 5
    retry_interval: 2s
    dependencies:
      - omni_remote_cache_service#build:debug
      - omni_remote_cache_worker#build
    cache:
      enabled: false

  test:
    dependencies:
      - test:service:native
      - test:service:worker

  publish:
    enabled: false

dependencies:
  - omni_remote_cache_service
  - omni_remote_cache_worker
