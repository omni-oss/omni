name: "Setup Omni"
description: "Setup Omni"
inputs:
  cache-key-prefix:
    description: "Additional text to prepend to cache keys"
    required: false
    default: "global"
  cache-restore-key-prefixes:
    description: "Additional text to prepend to cache restore keys"
    required: false
  shell:
    description: "Shell to use"
    required: false
    default: ${{ runner.os == 'Windows' && 'pwsh' || 'bash' }}
  github-token:
    description: "GitHub token for higher rate limit"
    required: false
    default: ${{ github.token }}
  version:
    description: "Version of Omni to install"
    required: false
    default: "v0.20.0" # most stable version

runs:
  using: "composite"
  steps:
    - name: Install Omni
      uses: omni-oss/setup-omni@v2
      with:
        github-token: ${{ inputs.github-token }}
        version: ${{ inputs.version }}

    - name: Get Workspace Hash
      id: get_workspace_hash
      run: echo "workspace_hash=$(omni hash -r workspace)" >> $GITHUB_OUTPUT
      shell: bash

    - name: Create Restore Key List
      shell: bash
      id: create_restore_key_list
      env:
        RAW_RESTORE_KEY_LIST: ${{ inputs.cache-restore-key-prefixes }}
        CACHE_KEY_PREFIX: ${{ inputs.cache-key-prefix }}
        RUNNER_OS: ${{ runner.os }}
      run: |
        # actions/cache allows at most 10 keys in total (1 primary + 9 restore keys).
        MAX_RESTORE_KEYS=9
        keys=()

        add_key() {
          local candidate="$1" existing
          for existing in "${keys[@]}"; do
            [ "$existing" = "$candidate" ] && return
          done
          keys+=("$candidate")
        }

        # most specific first: explicit prefixes (empty entries skipped, duplicates dropped)
        for prefix in $RAW_RESTORE_KEY_LIST; do
          add_key "${RUNNER_OS}-omni-${prefix}-"
        done
        if [ ${#keys[@]} -eq 0 ]; then
          add_key "${RUNNER_OS}-omni-${CACHE_KEY_PREFIX}-"
        fi
        # broadest fallback is always kept
        add_key "${RUNNER_OS}-omni-"

        if [ ${#keys[@]} -gt $MAX_RESTORE_KEYS ]; then
          echo "::warning::Truncating restore keys from ${#keys[@]} to $MAX_RESTORE_KEYS (actions/cache limit)"
          keys=("${keys[@]:0:$((MAX_RESTORE_KEYS - 1))}" "${RUNNER_OS}-omni-")
        fi

        {
          echo "restore_key_list<<EOF"
          printf '%s\n' "${keys[@]}"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
        echo "Restore Key List:"
        printf '%s\n' "${keys[@]}"

    - if: ${{ always() }}
      name: Cache Omni directory
      uses: actions/cache@v5
      with:
        path: |
          .omni
        key: ${{ runner.os }}-omni-${{ inputs.cache-key-prefix }}-${{ steps.get_workspace_hash.outputs.workspace_hash }}
        restore-keys: ${{ steps.create_restore_key_list.outputs.restore_key_list }}
