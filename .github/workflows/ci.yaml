name: CI

on:
  push:
    branches: [main]
    paths:
      - "**/*"
      - "!./apps/site/**"
      - "!bun.lock"
    # only trigger on tags that are workspace tags (e.g. v1.2.3) and not on tags that are for specific packages (e.g. package-v1.2.3)
    tags:
      - "v*.*.*"
      - "!*-v*.*.*"
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
      jobs_check_typescript: ${{ steps.plan.outputs.jobs_check_typescript }}
      jobs_check_typescript_count: ${{ steps.plan.outputs.jobs_check_typescript_count }}
      jobs_check_rust: ${{ steps.plan.outputs.jobs_check_rust }}
      jobs_check_rust_count: ${{ steps.plan.outputs.jobs_check_rust_count }}
      jobs_build_debug_rust: ${{ steps.plan.outputs.jobs_build_debug_rust }}
      jobs_build_debug_rust_count: ${{ steps.plan.outputs.jobs_build_debug_rust_count }}
      jobs_test_typescript: ${{ steps.plan.outputs.jobs_test_typescript }}
      jobs_test_typescript_count: ${{ steps.plan.outputs.jobs_test_typescript_count }}
      jobs_test_rust: ${{ steps.plan.outputs.jobs_test_rust }}
      jobs_test_rust_count: ${{ steps.plan.outputs.jobs_test_rust_count }}
      jobs_build_typescript: ${{ steps.plan.outputs.jobs_build_typescript }}
      jobs_build_typescript_count: ${{ steps.plan.outputs.jobs_build_typescript_count }}
      jobs_build_rust: ${{ steps.plan.outputs.jobs_build_rust }}
      jobs_build_rust_count: ${{ steps.plan.outputs.jobs_build_rust_count }}
      jobs_publish_npm: ${{ steps.plan.outputs.jobs_publish_npm }}
      jobs_publish_npm_count: ${{ steps.plan.outputs.jobs_publish_npm_count }}
      jobs_publish_rust_github: ${{ steps.plan.outputs.jobs_publish_rust_github }}
      jobs_publish_rust_github_count: ${{ steps.plan.outputs.jobs_publish_rust_github_count }}
      jobs_publish_generic: ${{ steps.plan.outputs.jobs_publish_generic }}
      jobs_publish_generic_count: ${{ steps.plan.outputs.jobs_publish_generic_count }}
      jobs_cache_restore_key_prefixes: ${{ steps.plan.outputs.jobs_cache_restore_key_prefixes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Omni
        uses: ./.github/actions/setup-omni
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache-key-prefix: plan
          cache-restore-key-prefixes: |
            publish_rust_github
            publish_generic
            publish_npm
            build_rust
            build_typescript
            test_rust
            test_typescript
            plan

      - name: Setup Tools
        uses: ./.github/actions/setup-tools
        with:
          install-all: false
          install-bun: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Release builds and publishing are only planned for tagged (release) runs.
      - name: Generate Dry Run Results
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            omni -i run -f=failed -d --result=result.json check build:debug test build publish
          else
            omni -i run -f=failed -d --result=result.json check build:debug test
          fi

      - name: Create Plan
        id: plan
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const execSync = require('child_process').execSync;

            // 1. Run the workspace's own create-jobs (not the published package, which
            // may not know about newer job types such as `check` and `build:debug`)
            execSync('bun install --frozen-lockfile --filter @omni-oss/create-jobs', { stdio: 'inherit' });
            execSync('bun run scripts/create-jobs/src/cli/index.ts result.json --output=jobs.json', { stdio: 'inherit' });

            // 2. Read and parse the generated JSON
            const jobsRaw = fs.readFileSync('jobs.json', 'utf8');
            const jobs = JSON.parse(jobsRaw);

            const updateArtifactData = (data) => {
                // do nothing for now
            }

            // Helper to set both the stringified JSON and the length count
            const setJobOutput = (name, data) => {
                data.forEach(updateArtifactData);
                core.setOutput(name, JSON.stringify(data));
                core.setOutput(`${name}_count`, data ? data.length : 0);
                core.info(`Set output ${name} to ${data.length} items:\n${JSON.stringify(data, null, 2)}`);
            };

            // 3. Set the full jobs output
            core.setOutput('jobs', jobsRaw);

            // 4. Set specific sections
            setJobOutput('jobs_check_typescript', jobs.check?.typescript || []);
            setJobOutput('jobs_check_rust', jobs.check?.rust || []);

            setJobOutput('jobs_build_debug_rust', jobs.build_debug?.rust || []);

            setJobOutput('jobs_test_typescript', jobs.test?.typescript || []);
            setJobOutput('jobs_test_rust', jobs.test?.rust || []);

            setJobOutput('jobs_build_typescript', jobs.build?.typescript || []);
            setJobOutput('jobs_build_rust', jobs.build?.rust || []);

            setJobOutput('jobs_publish_npm', jobs.publish?.npm || []);
            setJobOutput('jobs_publish_rust_github', jobs.publish?.rust_github || []);
            setJobOutput('jobs_publish_generic', jobs.publish?.generic || []);

      - name: Prune Unused Caches
        run: omni -i cache prune -sy -o="7d" # Remove stale caches older than 7 days

  # RFC 0023: libraries have no user-facing text sinks, and `log` and the
  # retired `trace` wrapper crate are not used. Presenter crates opt out with a
  # crate-level `#![allow(clippy::disallowed_macros)]`; tests are not linted.
  lint-output:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Tools
        uses: ./.github/actions/setup-tools
        with:
          install-all: false
          install-rust: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # `bridge_rpc_runner` embeds the built bridge service; an empty folder is
      # enough to type-check.
      - name: Stub the embedded bridge-service dist
        run: mkdir -p services/bridge-service/dist

      - name: No output macros or `log` in non-presenter crates
        run: cargo clippy --workspace --lib --bins -- -A clippy::all -D clippy::disallowed_macros

      - name: Builds with a `tracing` release level cap
        run: cargo check -p omni --release --features tracing/release_max_level_info

      - name: The `trace` crate and `enable-tracing` features are gone
        run: |
          if grep -rEn '^trace = |enable-tracing' --include=Cargo.toml --include='*.rs' crates cli services Cargo.toml; then
            echo "the \`trace\` crate and \`enable-tracing\` features were removed (RFC 0023); use \`tracing\` directly" >&2
            exit 1
          fi

  # Pipeline: check -> build (debug for rust) -> test -> release build (tags only).
  # Rust target dirs are carried between stages as run-scoped caches and
  # evicted by `cleanup-cache` at the end of the workflow.
  check-rust:
    needs:
      - plan
    if: ${{ needs.plan.outputs.jobs_check_rust_count > 0 }}
    uses: ./.github/workflows/run-omni-jobs.yaml
    secrets: inherit
    with:
      jobs: ${{ needs.plan.outputs.jobs_check_rust }}
      cache-key-prefix: check_rust
      cache-restore-key-prefixes: |
        build_debug_rust
        test_rust
        check_rust
      carry-stage: check

  check-typescript:
    needs:
      - plan
    if: ${{ needs.plan.outputs.jobs_check_typescript_count > 0 }}
    uses: ./.github/workflows/run-omni-jobs.yaml
    secrets: inherit
    with:
      jobs: ${{ needs.plan.outputs.jobs_check_typescript }}
      cache-key-prefix: check_typescript
      cache-restore-key-prefixes: |
        publish_npm
        build_typescript
        test_typescript
        check_typescript

  build-debug-rust:
    needs:
      - plan
      - check-rust
      - check-typescript
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.jobs_build_debug_rust_count > 0 }}
    uses: ./.github/workflows/run-omni-jobs.yaml
    secrets: inherit
    with:
      jobs: ${{ needs.plan.outputs.jobs_build_debug_rust }}
      cache-key-prefix: build_debug_rust
      cache-restore-key-prefixes: |
        build_debug_rust
        check_rust
      carry-stage: build-debug

  build-typescript:
    needs:
      - plan
      - check-typescript
      - check-rust
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.jobs_build_typescript_count > 0 }}
    uses: ./.github/workflows/run-omni-jobs.yaml
    secrets: inherit
    with:
      jobs: ${{ needs.plan.outputs.jobs_build_typescript }}
      cache-key-prefix: build_typescript
      cache-restore-key-prefixes: |
        build_typescript
        check_typescript
        test_typescript
      save-outputs: true
      artifacts-name: build-typescript

  test-rust:
    needs:
      - plan
      - build-debug-rust
      - build-typescript
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.jobs_test_rust_count > 0 }}
    uses: ./.github/workflows/run-omni-jobs.yaml
    secrets: inherit
    with:
      jobs: ${{ needs.plan.outputs.jobs_test_rust }}
      cache-key-prefix: test_rust
      cache-restore-key-prefixes: |
        build_rust
        build_debug_rust
        test_rust
      carry-stage: test

  test-typescript:
    needs:
      - plan
      - build-typescript
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.jobs_test_typescript_count > 0 }}
    uses: ./.github/workflows/run-omni-jobs.yaml
    secrets: inherit
    with:
      jobs: ${{ needs.plan.outputs.jobs_test_typescript }}
      cache-key-prefix: test_typescript
      cache-restore-key-prefixes: |
        publish_npm
        build_typescript
        test_typescript

  # Release build: only for tagged (release) runs, after everything passed.
  build-rust:
    needs:
      - plan
      - test-rust
      - test-typescript
    if: ${{ !cancelled() && !failure() && startsWith(github.ref, 'refs/tags/') && needs.plan.outputs.jobs_build_rust_count > 0 }}
    uses: ./.github/workflows/run-omni-jobs.yaml
    secrets: inherit
    with:
      jobs: ${{ needs.plan.outputs.jobs_build_rust }}
      cache-key-prefix: build_rust
      cache-restore-key-prefixes: |
        publish_rust_github
        build_rust
      save-outputs: true
      artifacts-name: build-rust
      carry-stage: release

  resolve-versions:
    needs:
      - plan
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    outputs:
      # Add a new output here (and a matching entry in VERSION_SPECS below)
      # to expose another package's version to downstream jobs.
      omni_version: ${{ steps.resolve.outputs.omni_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve versions from tags
        id: resolve
        uses: actions/github-script@v8
        with:
          script: |
            const { execSync } = require('child_process');

            // Registry of package versions to resolve from the tags at the
            // current commit. To support a new package, add an entry here and
            // declare a matching job output above.
            //
            //   output: the job output name to expose the version as.
            //   prefix: the tag prefix that precedes the `v<semver>` portion.
            //
            // e.g. the `omni-` prefix on the tag `omni-v0.17.1` yields the
            // exposed value `v0.17.1`.
            const VERSION_SPECS = [
              { output: 'omni_version', prefix: 'omni-' },
            ];

            // Gather all tags that point at the current (tagged) commit.
            const tags = execSync('git tag --points-at HEAD', { encoding: 'utf8' })
              .split('\n')
              .map((tag) => tag.trim())
              .filter(Boolean);

            core.info(`Tags at current commit:\n${tags.join('\n') || '(none)'}`);

            for (const { output, prefix } of VERSION_SPECS) {
              // Match `<prefix>v<semver>` and expose only the `v<semver>` part.
              const pattern = new RegExp(`^${prefix}(v\\d+\\.\\d+\\.\\d+.*)$`);
              const match = tags.map((tag) => tag.match(pattern)).find(Boolean);
              const version = match ? match[1] : '';

              if (version) {
                core.info(`Resolved ${output}: ${version}`);
              } else {
                core.info(`No tag matching ${prefix}v<semver> found for ${output}`);
              }

              core.setOutput(output, version);
            }

  publish-generic:
    needs:
      - plan
      - resolve-versions
      - build-rust
      - build-typescript
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.jobs_publish_generic_count > 0 && startsWith(github.ref, 'refs/tags/') }}
    uses: ./.github/workflows/run-omni-jobs.yaml
    secrets: inherit
    with:
      jobs: ${{ needs.plan.outputs.jobs_publish_generic }}
      cache-key-prefix: publish_generic
      cache-restore-key-prefixes: |
        publish_generic
        publish_rust_github
        publish_npm
        build_rust
        build_typescript
        test_rust
        test_typescript

  publish-npm:
    needs:
      - plan
      - resolve-versions
      - build-typescript
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.jobs_publish_npm_count > 0 && startsWith(github.ref, 'refs/tags/') }}
    uses: ./.github/workflows/run-omni-jobs.yaml
    secrets: inherit
    with:
      jobs: ${{ needs.plan.outputs.jobs_publish_npm }}
      cache-key-prefix: publish_npm
      cache-restore-key-prefixes: |
        publish_npm
        build_rust
        build_typescript

  publish-rust-github:
    needs:
      - plan
      - resolve-versions
      - build-rust
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.jobs_publish_rust_github_count > 0 && startsWith(github.ref, 'refs/tags/') }}
    uses: ./.github/workflows/publish-rust-github.yaml
    permissions:
      actions: read
      contents: write
    secrets: inherit
    with:
      jobs: ${{ needs.plan.outputs.jobs_publish_rust_github }}
      artifacts_pattern: build-rust-*

  publish-json-schemas:
    needs:
      - plan
      - resolve-versions
      - build-rust
      - publish-rust-github
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.jobs_publish_rust_github_count > 0 && startsWith(github.ref, 'refs/tags/') }}
    uses: ./.github/workflows/publish-json-schemas.yaml
    secrets: inherit
    permissions:
      actions: read
      contents: write
    with:
      version: ${{ needs.resolve-versions.outputs.omni_version }}

  # Evict the run-scoped rust carry-over caches once the workflow is done.
  cleanup-cache:
    needs:
      - check-rust
      - build-debug-rust
      - test-rust
      - build-rust
      - publish-generic
      - publish-npm
      - publish-rust-github
      - publish-json-schemas
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete carry-over caches
        uses: actions/github-script@v8
        with:
          script: |
            const prefix = `carry-rust-${context.runId}-`;
            const caches = await github.paginate(
              github.rest.actions.getActionsCacheList,
              { owner: context.repo.owner, repo: context.repo.repo, key: prefix, per_page: 100 },
            );
            for (const cache of caches.filter((c) => c.key.startsWith(prefix))) {
              core.info(`Deleting cache ${cache.key}`);
              await github.rest.actions.deleteActionsCacheById({
                owner: context.repo.owner,
                repo: context.repo.repo,
                cache_id: cache.id,
              });
            }

  # Static gatekeeper: this is the ONLY status check to require in the
  # branch protection rule / ruleset for `main`. GitHub cannot match the
  # dynamic / matrix check names produced by the reusable workflows above
  # (e.g. `test-rust / Run Multiplatform Jobs (...)`), so we collapse them
  # into this single, stable check.
  ci-gatekeeper:
    name: CI Passed
    needs:
      - plan
      - lint-output
      - check-rust
      - check-typescript
      - build-debug-rust
      - test-rust
      - test-typescript
      - build-rust
      - build-typescript
      - resolve-versions
      - publish-generic
      - publish-npm
      - publish-rust-github
      - publish-json-schemas
    # Always run so the check reports even when upstream jobs fail or are
    # skipped; otherwise the required check would never post a status.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate upstream job results
        uses: actions/github-script@v8
        # Pass ONLY each job's small `.result` string. Do not use
        # `toJSON(needs)` here: the `needs` context also carries every
        # upstream job's outputs (e.g. `plan`'s large `jobs` payload), which
        # overflows the process environment and fails with E2BIG /
        # "Argument list too long" when the node runner starts.
        env:
          RESULTS_JSON: |
            {
              "plan": "${{ needs.plan.result }}",
              "lint-output": "${{ needs.lint-output.result }}",
              "check-rust": "${{ needs.check-rust.result }}",
              "check-typescript": "${{ needs.check-typescript.result }}",
              "build-debug-rust": "${{ needs.build-debug-rust.result }}",
              "test-rust": "${{ needs.test-rust.result }}",
              "test-typescript": "${{ needs.test-typescript.result }}",
              "build-rust": "${{ needs.build-rust.result }}",
              "build-typescript": "${{ needs.build-typescript.result }}",
              "resolve-versions": "${{ needs.resolve-versions.result }}",
              "publish-generic": "${{ needs.publish-generic.result }}",
              "publish-npm": "${{ needs.publish-npm.result }}",
              "publish-rust-github": "${{ needs.publish-rust-github.result }}",
              "publish-json-schemas": "${{ needs.publish-json-schemas.result }}"
            }
        with:
          script: |
            const results = JSON.parse(process.env.RESULTS_JSON);

            // A `skipped` result is expected (tag-only jobs on PRs, empty
            // plans, etc.) and must NOT fail the gate. Only real failures
            // and cancellations should block a merge.
            const blocking = ['failure', 'cancelled'];
            const failed = [];

            for (const [name, result] of Object.entries(results)) {
              core.info(`${name}: ${result}`);
              if (blocking.includes(result)) {
                failed.push(`${name}: ${result}`);
              }
            }

            if (failed.length > 0) {
              core.setFailed(`Upstream jobs did not pass:\n${failed.join('\n')}`);
            } else {
              core.info('All required upstream jobs passed (or were skipped).');
            }

