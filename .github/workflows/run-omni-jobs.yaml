name: Run Omni Jobs

on:
  workflow_call:
    inputs:
      jobs:
        description: The jobs to run
        required: true
        type: string
      default-runner:
        description: The default runner to use
        required: false
        default: ubuntu-latest
        type: string
      save-outputs:
        description: Whether to save the outputs as artifacts
        required: false
        default: false
        type: boolean
      artifacts-name:
        description: The name of the artifacts
        required: false
        default: artifacts
        type: string
      cache-key-prefix:
        description: The prefix to use for the cache key
        required: false
        default: global
        type: string
      cache-lane:
        description: >-
          Cache prefixes of every stage in this pipeline lane, in pipeline order
          (one per line). Restore keys are derived from it by proximity to
          `cache-key-prefix`.
        required: false
        type: string
      cache-restore-key-prefixes:
        description: Deprecated, same as `cache-lane` (used when `cache-lane` is empty)
        required: false
        type: string
      carry-stage:
        description: Stage name; when set, the rust target dir is uploaded as a run-scoped carry-over cache
        required: false
        default: ""
        type: string

  workflow_dispatch:
    inputs:
      jobs:
        description: The jobs to run
        required: true
        type: string
      default-runner:
        description: The default runner to use
        required: false
        default: ubuntu-latest
        type: string
      save-outputs:
        description: Whether to save the outputs as artifacts
        required: false
        default: false
        type: boolean
      cache-key-prefix:
        description: The prefix to use for the cache key
        required: false
        default: global
        type: string
      cache-lane:
        description: >-
          Cache prefixes of every stage in this pipeline lane, in pipeline order
          (one per line). Restore keys are derived from it by proximity to
          `cache-key-prefix`.
        required: false
        type: string
      cache-restore-key-prefixes:
        description: Deprecated, same as `cache-lane` (used when `cache-lane` is empty)
        required: false
        type: string

jobs:
  plan:
    outputs:
      jobs_count: ${{ steps.split.outputs.jobs_count }}
      restore_key_prefixes: ${{ steps.split.outputs.restore_key_prefixes }}
      jobs: ${{ steps.split.outputs.jobs }}
      multiplatform_matrix: ${{ steps.split.outputs.multiplatform_matrix }}
      multiplatform_jobs_count: ${{ steps.split.outputs.multiplatform_jobs_count }}
    runs-on: ubuntu-latest
    steps:
      - name: Split
        id: split
        uses: actions/github-script@v8
        env:
          RAW_JSON: ${{ inputs.jobs }}
          CACHE_KEY_PREFIX: ${{ inputs.cache-key-prefix }}
          CACHE_LANE: ${{ inputs.cache-lane || inputs.cache-restore-key-prefixes }}
        with:
          script: |
            const jobsInput = JSON.parse(process.env.RAW_JSON);

            // Restore-key priority. actions/cache tries the restore keys in order and
            // takes the newest cache matching the first key that has any match, so
            // the order decides which cache seeds this job:
            //   1. this stage itself: the same task set, from the previous run;
            //   2. earlier stages, nearest first: they ran this stage's dependency
            //      tasks (e.g. `test` re-uses the `build:debug` and `check` entries);
            //   3. later stages, nearest first: supersets of this stage's tasks, but
            //      older (tags only) and so less likely to match recent hashes.
            // Stages of other lanes are skipped on purpose: their task entries
            // never match.
            const orderRestorePrefixes = (own, lane) => {
                const stages = [...new Set(lane)];
                const i = stages.indexOf(own);
                if (i < 0) {
                    return [own, ...stages];
                }
                return [
                    own,
                    ...stages.slice(0, i).reverse(),
                    ...stages.slice(i + 1),
                ];
            };
            const lane = (process.env.CACHE_LANE ?? '')
                .split(/\s+/)
                .filter(Boolean);
            const orderedPrefixes = orderRestorePrefixes(
                process.env.CACHE_KEY_PREFIX,
                lane,
            );

            const jobs = [];
            const matrixMap = {};

            for (const job of jobsInput) {
                const targetEntries = Object.entries(job.meta?.targets ?? {});

                if (targetEntries.length > 0) {
                    for (const [targetName, data] of targetEntries) {
                        const keyParts = [targetName];
                        if (job.meta.language) {
                            keyParts.push(job.meta.language);
                        }
                        if (job.meta.sdk) {
                            keyParts.push(job.meta.sdk);
                        }
                        if (data.runner) {
                            keyParts.push(data.runner);
                        }
                        const key = keyParts.join('-');

                        if (!matrixMap[key]) {
                            // target-scoped keys only (priority order), then the broad
                            // target key; setup-omni appends the global fallback and
                            // enforces the actions/cache key limit.
                            const restoreKeyPrefixes = [
                                ...orderedPrefixes.map(prefix => `${targetName}-${prefix}`),
                                targetName,
                            ]
                                .join("\n");
                            matrixMap[key] = {
                                runner: data.runner,
                                target: targetName,
                                jobs: [job],
                                env: {
                                    TARGET: targetName,
                                },
                                cache_restore_key_prefixes: restoreKeyPrefixes,
                            };
                        } else {
                            matrixMap[key].jobs.push(job);
                        }

                        // Capabilities this lane must prove (RFC 0027, section 10).
                        // A gated test that cannot run here fails instead of
                        // skipping, so a lane that loses a capability goes red.
                        // Linux and macOS prove reflink (Linux on the loop volume
                        // the "Prepare reflink test volume" step mounts; macOS on
                        // its APFS temp dir). Windows runners have no ReFS volume,
                        // so reflink is not required there; the fall-back tests
                        // run on every lane.
                        if (targetName === 'x86_64-unknown-linux-gnu' || targetName.includes('apple-darwin')) {
                            matrixMap[key].env.OMNI_TEST_REQUIRE_CAPABILITIES = 'symlink,hardlink,git,reflink';
                        } else if (targetName.includes('windows')) {
                            matrixMap[key].env.OMNI_TEST_REQUIRE_CAPABILITIES = 'symlink,hardlink,git';
                        }
                        // aarch64 Linux tests run under `cross` in a container that
                        // does not see the host volume or these variables.
                        if (targetName === 'x86_64-unknown-linux-gnu') {
                            matrixMap[key].env.OMNI_TEST_REFLINK_DIR = '/mnt/omni-reflink';
                        }

                        if (typeof job.meta.language === 'string') {
                            const varName = job.meta.language.toUpperCase() + '_TARGET'
                            if (varName === "RUST_TARGET") {
                                switch(targetName) {
                                    case "aarch64-unknown-linux-gnu":
                                        matrixMap[key].env[varName] = `x86_64-unknown-linux-gnu;${targetName}`;
                                        break;
                                    // case "x86_64-macos-darwin":
                                    //     matrixMap[key].env[varName] = `aarch64-apple-darwin;${targetName}`;
                                    //     break;
                                    case "aarch64-pc-windows-msvc":
                                        matrixMap[key].env[varName] = `x86_64-pc-windows-msvc;${targetName}`;
                                        break;
                                    default:
                                        matrixMap[key].env[varName] = targetName;
                                }
                            } else {
                                matrixMap[key].env[varName] = targetName;
                            }
                        }

                        if (typeof job.meta.sdk === 'string') {
                            matrixMap[key].env[job.meta.sdk.toUpperCase() + '_TARGET'] = targetName;
                        }
                    }
                } else {
                    jobs.push(job);
                }
            }

            const multiplatformMatrix = Object.values(matrixMap);
            const multiplatformJobsCount = multiplatformMatrix.reduce((acc, matrix) => acc + matrix.jobs.length, 0);

            core.setOutput('jobs_count', jobs.length);
            core.setOutput('restore_key_prefixes', orderedPrefixes.join('\n'));
            core.setOutput('jobs', JSON.stringify(jobs));
            core.setOutput('multiplatform_matrix', JSON.stringify(multiplatformMatrix));
            core.setOutput('multiplatform_jobs_count', multiplatformJobsCount);

            core.info(`jobs_count: ${jobs.length}`);
            core.info(`jobs: ${JSON.stringify(jobs, null, 4)}`);
            core.info(`multiplatform_jobs_count: ${multiplatformJobsCount}`);
            core.info(`multiplatform_matrix: ${JSON.stringify(multiplatformMatrix, null, 4)}`);

          result-encoding: string

  run-jobs:
    needs:
      - plan
    if: ${{ needs.plan.outputs.jobs_count > 0 }}
    name: Run Jobs
    runs-on: ${{ inputs.default-runner }}
    env:
      # Jobs without a platform matrix run on the default Linux runner. Tests
      # gated on a capability (RFC 0027, section 10) must fail there rather than
      # skip: symlinks, hard links and a `git` binary are always available.
      OMNI_TEST_REQUIRE_CAPABILITIES: symlink,hardlink,git
    steps:
      - name: Expose Secrets with ENV_ Prefix
        shell: bash
        env:
          SECRETS_CONTEXT: ${{ toJSON(secrets) }}
        run: |
          # 1. Filter secrets starting with ENV_
          echo "$SECRETS_CONTEXT" | jq -r 'to_entries[] | select(.key | startswith("ENV_")) | "\(.key)=\(.value)"' | while read -r line; do

            # 2. Separate the original key and value
            ORIG_KEY=$(echo "$line" | cut -d '=' -f 1)
            VALUE=$(echo "$line" | cut -d '=' -f 2-)

            # 3. Strip 'ENV_' from the beginning of the key
            STRIPPED_KEY=${ORIG_KEY#ENV_}

            echo "Exposing secret: $STRIPPED_KEY"

            # 4. Write the clean key to the global environment file
            echo "$STRIPPED_KEY=$VALUE" >> $GITHUB_ENV
          done

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Process JSON
        id: process
        shell: bash
        env:
          RAW_JSON: ${{ needs.plan.outputs.jobs }}
        run: |
          echo "Received jobs: $RAW_JSON"
          # Use jq to map the names and join them with spaces
          PROJECT_FLAGS=$(echo $RAW_JSON | jq -r '. | map("-p \"\(.project_name)\"") | join(" ")')
          TASK_ARGS=$(echo $RAW_JSON | jq -r '. | map(.task_name) | unique | join(" ")')
          echo "TASK_ARGS=$TASK_ARGS" >> $GITHUB_OUTPUT
          echo "PROJECT_FLAGS=$PROJECT_FLAGS" >> $GITHUB_OUTPUT
          echo "Task Args: $TASK_ARGS"
          echo "Project Flags: $PROJECT_FLAGS"

      - if: ${{ inputs.carry-stage != '' }}
        name: Carry Rust Target Dir Across Stages
        uses: actions/cache@v5
        with:
          path: |
            target
            !target/**/incremental
          key: carry-rust-${{ github.run_id }}-host-${{ inputs.carry-stage }}
          restore-keys: |
            carry-rust-${{ github.run_id }}-host-

      - name: Setup Omni
        uses: ./.github/actions/setup-omni
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache-key-prefix: ${{ inputs.cache-key-prefix }}
          cache-restore-key-prefixes: ${{ needs.plan.outputs.restore_key_prefixes }}

      - name: Determine Build Tools
        id: determine
        uses: ./.github/actions/determine-build-tools
        with:
          omni-run: -f=failed ${{ steps.process.outputs.TASK_ARGS }} ${{ steps.process.outputs.PROJECT_FLAGS }}

      - name: Setup Tools
        uses: ./.github/actions/setup-tools
        with:
          install-all: false
          install-rust: ${{ steps.determine.outputs.INSTALL_RUST_TOOLS }}
          install-rust-target: ${{ steps.determine.outputs.INSTALL_RUST_TOOLS }}
          install-bun: ${{ steps.determine.outputs.INSTALL_JS_TOOLS }}
          install-deno: ${{ steps.determine.outputs.INSTALL_JS_TOOLS }}
          install-node: ${{ steps.determine.outputs.INSTALL_JS_TOOLS }}
          install-node-modules: ${{ steps.determine.outputs.INSTALL_JS_TOOLS }}
          cache-key-prefix: ${{ inputs.cache-key-prefix }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Tasks
        run: omni -i run -f=failed ${{ steps.process.outputs.TASK_ARGS }} ${{ steps.process.outputs.PROJECT_FLAGS }}

      - if: ${{ inputs.save-outputs }}
        name: Save Outputs As Artifacts
        uses: ./.github/actions/package-jobs-artifacts
        with:
          jobs: ${{ needs.plan.outputs.jobs }}
          name: ${{ inputs.artifacts-name }}

      - name: Prune Unused Caches
        run: omni -i cache prune -sy -o="7d" # Remove stale caches older than 7 days

  run-jobs-multiplatform:
    needs:
      - plan
    if: ${{ needs.plan.outputs.multiplatform_jobs_count > 0 }}
    name: Run Multiplatform Jobs
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.multiplatform_matrix) }}
      fail-fast: false

    env: ${{ matrix.env }}

    steps:
      - name: Expose Secrets with ENV_ Prefix
        shell: bash
        env:
          SECRETS_CONTEXT: ${{ toJSON(secrets) }}
        run: |
          # 1. Filter secrets starting with ENV_
          echo "$SECRETS_CONTEXT" | jq -r 'to_entries[] | select(.key | startswith("ENV_")) | "\(.key)=\(.value)"' | while read -r line; do

            # 2. Separate the original key and value
            ORIG_KEY=$(echo "$line" | cut -d '=' -f 1)
            VALUE=$(echo "$line" | cut -d '=' -f 2-)

            # 3. Strip 'ENV_' from the beginning of the key
            STRIPPED_KEY=${ORIG_KEY#ENV_}

            echo "Exposing secret: $STRIPPED_KEY"

            # 4. Write the clean key to the global environment file
            echo "$STRIPPED_KEY=$VALUE" >> $GITHUB_ENV
          done

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Process JSON
        id: process
        shell: bash
        env:
          RAW_JSON: ${{ toJSON(matrix.jobs) }}
        run: |
          echo "Received jobs: $RAW_JSON"
          # Use jq to map the names and join them with spaces
          PROJECT_FLAGS=$(echo $RAW_JSON | jq -r '. | map("-p \"\(.project_name)\"") | join(" ")')
          TASK_ARGS=$(echo $RAW_JSON | jq -r '. | map(.task_name) | unique | join(" ")')
          echo "TASK_ARGS=$TASK_ARGS" >> $GITHUB_OUTPUT
          echo "PROJECT_FLAGS=$PROJECT_FLAGS" >> $GITHUB_OUTPUT
          echo "Task Args: $TASK_ARGS"
          echo "Project Flags: $PROJECT_FLAGS"

      - if: ${{ inputs.carry-stage != '' }}
        name: Carry Rust Target Dir Across Stages
        uses: actions/cache@v5
        with:
          path: |
            target
            !target/**/incremental
          key: carry-rust-${{ github.run_id }}-${{ matrix.target }}-${{ inputs.carry-stage }}
          restore-keys: |
            carry-rust-${{ github.run_id }}-${{ matrix.target }}-

      - name: Setup Omni
        uses: ./.github/actions/setup-omni
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache-key-prefix: ${{ matrix.target }}-${{ inputs.cache-key-prefix }}
          cache-restore-key-prefixes: ${{ matrix.cache_restore_key_prefixes }}

      - name: Determine Build Tools
        id: determine
        uses: ./.github/actions/determine-build-tools
        with:
          omni-run: -f=failed ${{ steps.process.outputs.TASK_ARGS }} ${{ steps.process.outputs.PROJECT_FLAGS }}

      - name: Setup Tools
        uses: ./.github/actions/setup-tools
        with:
          install-all: false
          rust-target: ${{ matrix.target }}
          install-rust: ${{ steps.determine.outputs.INSTALL_RUST_TOOLS }}
          install-rust-target: ${{ steps.determine.outputs.INSTALL_RUST_TOOLS }}
          install-bun: ${{ steps.determine.outputs.INSTALL_JS_TOOLS }}
          install-deno: ${{ steps.determine.outputs.INSTALL_JS_TOOLS }}
          install-node: ${{ steps.determine.outputs.INSTALL_JS_TOOLS }}
          install-node-modules: ${{ steps.determine.outputs.INSTALL_JS_TOOLS }}
          cache-key-prefix: ${{ matrix.target }}-${{ inputs.cache-key-prefix }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # A reflink-capable filesystem for the tests that need one (RFC 0027,
      # section 10). The default runner disk is ext4, which cannot reflink.
      - if: ${{ format('{0}', matrix.env.OMNI_TEST_REFLINK_DIR) != '' }}
        name: Prepare reflink test volume
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends btrfs-progs
          truncate -s 2G "$RUNNER_TEMP/reflink.img"
          mkfs.btrfs -q "$RUNNER_TEMP/reflink.img"
          sudo mkdir -p "$OMNI_TEST_REFLINK_DIR"
          sudo mount -o loop "$RUNNER_TEMP/reflink.img" "$OMNI_TEST_REFLINK_DIR"
          sudo chown "$(id -u):$(id -g)" "$OMNI_TEST_REFLINK_DIR"
          findmnt "$OMNI_TEST_REFLINK_DIR"

      - name: Run Tasks
        run: omni -i run -f=failed ${{ steps.process.outputs.TASK_ARGS }} ${{ steps.process.outputs.PROJECT_FLAGS }}

      - if: ${{ inputs.save-outputs }}
        name: Save Outputs As Artifacts
        uses: ./.github/actions/package-jobs-artifacts
        with:
          jobs: ${{ toJSON(matrix.jobs) }}
          target: ${{ matrix.target }}
          name: ${{ inputs.artifacts-name }}-${{ matrix.target }}

      - name: Prune Unused Caches
        run: omni -i cache prune -sy -o="7d" # Remove stale caches older than 7 days
