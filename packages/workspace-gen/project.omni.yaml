# yaml-language-server: $schema=https://raw.githubusercontent.com/omni-oss/json-schemas/refs/heads/main/project.json
name: "@omni-oss/workspace-gen"

extends:
  - "@workspace/omni/presets/ts-lib.omni.yaml"

dependencies:
  - omni_workspace_gen_wasm

tasks:
  build:
    enabled: true
    dependencies:
      append:
        - omni_workspace_gen_wasm#build
    exec: >
      bun -e '
        import fs from "node:fs/promises";
        import fsSync from "node:fs";
        await fs.cp("../../crates/omni_workspace_gen_wasm/dist", "./dist", { recursive: true });
        const packageJson = "./dist/package.json";
        if (fsSync.existsSync(packageJson)) {
          await fs.rm(packageJson);
        }
        const gitignore = "./dist/.gitignore";
        if (fsSync.existsSync(gitignore)) {
          await fs.rm(gitignore);
        }
        const distDist = "./dist/dist";
        if (fsSync.existsSync(distDist)) {
          await fs.rm(distDist, { recursive: true });
        }
      '
    cache:
      key:
        files:
          - "../../crates/omni_workspace_gen_wasm/src/**"
          - "../../crates/omni_workspace_gen_wasm/Cargo.toml"
      output:
        files:
          - "dist/**"

  test:unit:
    enabled: false

  test:integration:
    enabled: false

  test:
    enabled: false

  publish:
    enabled: true

meta:
  publish: true
