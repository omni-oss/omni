[package]
name = "omni_tool"
rust-version.workspace = true
edition.workspace = true
version = "0.1.0"
authors.workspace = true
repository.workspace = true

[lib]
name = "omni_tool"
path = "src/lib.rs"

[features]
default = ["enable-tracing"]
enable-tracing = ["dep:tracing", "trace/enabled"]

[dependencies]
eyre = { workspace = true }
thiserror = { workspace = true }
strum = { workspace = true }
trace = { workspace = true }
tracing = { workspace = true, optional = true }
log = { workspace = true }
bon = { workspace = true }
derive-new = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
system_traits = { workspace = true, features = [
    "real-sync",
    "real-async-tokio",
    "memory-sync",
    "memory-async",
] }
omni_tool_configurations = { workspace = true }
omni_configuration_discovery = { workspace = true }
omni_constants = { workspace = true }
omni_file_data_serde = { workspace = true }
omni_discovery = { workspace = true }
bridge_rpc_runner = { workspace = true }
bridge_rpc_router = { workspace = true }
bridge_rpc_services = { workspace = true }
omni_capabilities = { workspace = true }
omni_capability_enforcement = { workspace = true }
omni_capability_sys = { workspace = true }
omni_messages = { workspace = true }
omni_tera = { workspace = true }

[dev-dependencies]
test-log = { workspace = true }
rstest = { workspace = true }
rstest_reuse = { workspace = true }
tempfile = { workspace = true }
