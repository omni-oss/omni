# yaml-language-server: $schema=https://raw.githubusercontent.com/omni-oss/json-schemas/refs/heads/main/project.json
name: bridge_rpc_runner
extends:
  - "@workspace/omni/presets/rust-lib.omni.yaml"

tasks:
  # `cargo clippy` compiles the embedded `services/bridge-service/dist`.
  check:lint:
    dependencies:
      append: ["@omni-oss/bridge-service#build"]

  test:
    dependencies:
      append: ["@omni-oss/bridge-service#build"]

dependencies:
  - omni_utils
  - omni_capability_enforcement
  - bridge_rpc_core
  - bridge_rpc_router
  - "@omni-oss/bridge-service"
  - omni_capabilities
  - omni_messages
  - omni_notice
  - omni_codes
