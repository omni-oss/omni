[package]
name = "omni_remote_cache_core"
rust-version.workspace = true
edition.workspace = true
version = "0.1.0"
authors.workspace = true
repository.workspace = true

[lib]
name = "omni_remote_cache_core"
path = "src/lib.rs"

[dependencies]
async-trait = { workspace = true }
axum = { version = "^0.8.9", default-features = false, features = [
    "json",
    "query",
    "macros",
    "matched-path",
    "original-uri",
] }
axum-extra = { workspace = true }
bytes = { workspace = true }
bytesize = { workspace = true }
derive-new = { workspace = true }
eyre = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
http-body = { workspace = true }
maps = { workspace = true }
noyalib = { workspace = true }
omni_path_utils = { workspace = true }
omni_remote_cache_storage_core = { workspace = true, features = ["utoipa"] }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sets = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
time = { workspace = true, features = ["wasm-bindgen"] }
