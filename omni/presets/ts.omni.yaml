# yaml-language-server: $schema=https://raw.githubusercontent.com/omni-oss/json-schemas/refs/heads/main/project.json
name: ts

extends: ["./base.omni.yaml"]

cache:
  key:
    files:
      - "package.json"
      - "./src/**/*.{ts,tsx,js,jsx,cjs,mjs,mts,cts}"

tasks:
  test:unit:
    exec: bun run test:unit
    dependencies:
      - ^build
      - build

  test:integration:
    exec: bun run test:integration
    dependencies:
      - test:unit

  test:
    exec: ""
    dependencies:
      - ^test
      - test:unit
      - test:integration

  build:
    exec: bun run build
    dependencies:
      - ^build
      - check
    cache:
      output:
        files:
          - dist/**/*

  check:format:
    exec: bun x oxfmt --check
    cache:
      key:
        files:
          append:
            - "@workspace/oxfmt.config.ts"
            - "@workspace/packages/oxfmt-config/src/**"

  check:lint:
    # Root-only oxlint options must apply even when checking a single package.
    exec: sh -c 'project="$PWD" && cd "$(git rev-parse --show-toplevel)" && bun x oxlint "$project"'
    dependencies:
      - ^build
    cache:
      key:
        files:
          append:
            - "oxlint.config.ts"
            - "tsconfig*.json"
            - "@workspace/oxlint.config.ts"
            - "@workspace/packages/oxlint-config/src/**"
            - "@workspace/packages/tsconfig/*.json"

  check:types:
    exec: sh -c 'bun x tsc --noEmit -p tsconfig.json && if [ -f tsconfig.node.json ]; then bun x tsc --noEmit -p tsconfig.node.json; fi'
    dependencies:
      - ^build
    cache:
      key:
        files:
          append:
            - "tsconfig*.json"
            - "*.config.ts"
            - "*.config.*.ts"
            - ".storybook/*.ts"
            - "scripts/**/*.ts"
            - "@workspace/packages/tsconfig/*.json"

  check:
    exec: ""
    dependencies:
      - check:types
      - check:lint
      - check:format

meta:
  language: typescript
