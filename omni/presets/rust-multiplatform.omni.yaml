# yaml-language-server: $schema=https://raw.githubusercontent.com/omni-oss/json-schemas/refs/heads/main/project.json
name: rust-multiplatform

extends:
  - ./rust.omni.yaml

cache:
  key:
    env:
      append:
        - RUST_TARGET

tasks:
  # ---------------------------------------------------------------------------
  # test
  # ---------------------------------------------------------------------------
  # Shared configuration for every per-target test task. Concrete tasks only
  # override `enabled` and `exec` (and append extra cache keys where needed).
  test-base:
    base: true
    dependencies:
      - ^test
    env:
      vars:
        # RUST_LOG_SPAN_EVENTS: new,close
        RUST_LOG: trace
    cache:
      key:
        env:
          append: [RUST_TEST_ADDITIONAL_ARGS]
        files:
          append: ["./tests/**/*.rs"]

  test:aarch64-unknown-linux-gnu:
    extends: [test-base]
    enabled: "{{ env.RUST_TARGET is defined and env.RUST_TARGET is containing(pat='aarch64-unknown-linux-gnu') }}"
    exec: cross test --target aarch64-unknown-linux-gnu -p ${PROJECT_NAME} ${RUST_TEST_ADDITIONAL_ARGS:-}
    cache:
      key:
        files:
          append: ["@workspace/Cross.toml"]

  test:x86_64-unknown-linux-gnu:
    extends: [test-base]
    enabled: "{{ env.RUST_TARGET is defined and env.RUST_TARGET is containing(pat='x86_64-unknown-linux-gnu') }}"
    exec: cargo test --target x86_64-unknown-linux-gnu -p ${PROJECT_NAME} ${RUST_TEST_ADDITIONAL_ARGS:-}

  test:x86_64-apple-darwin:
    extends: [test-base]
    enabled: "{{ env.RUST_TARGET is defined and env.RUST_TARGET is containing(pat='x86_64-apple-darwin') }}"
    exec: cargo test --target x86_64-apple-darwin -p ${PROJECT_NAME} ${RUST_TEST_ADDITIONAL_ARGS:-}

  test:aarch64-apple-darwin:
    extends: [test-base]
    enabled: "{{ env.RUST_TARGET is defined and env.RUST_TARGET is containing(pat='aarch64-apple-darwin') }}"
    exec: cargo test --target aarch64-apple-darwin -p ${PROJECT_NAME} ${RUST_TEST_ADDITIONAL_ARGS:-}

  test:x86_64-pc-windows-msvc:
    extends: [test-base]
    enabled: "{{ env.RUST_TARGET is defined and env.RUST_TARGET is containing(pat='x86_64-pc-windows-msvc') }}"
    exec: cargo test --target x86_64-pc-windows-msvc -p ${PROJECT_NAME} ${RUST_TEST_ADDITIONAL_ARGS:-}

  test:aarch64-pc-windows-msvc:
    extends: [test-base]
    enabled: "{{ env.RUST_TARGET is defined and env.RUST_TARGET is containing(pat='aarch64-pc-windows-msvc') }}"
    exec: cargo test --target aarch64-pc-windows-msvc -p ${PROJECT_NAME} ${RUST_TEST_ADDITIONAL_ARGS:-}

  test:current:
    extends: [test-base]
    enabled: "{{ env.RUST_TARGET is undefined or env.RUST_TARGET == '' }}"
    exec: cargo test -p ${PROJECT_NAME} ${RUST_TEST_ADDITIONAL_ARGS:-}

  test:
    exec: ""
    dependencies:
      - ^test
      - test:current
      - test:aarch64-unknown-linux-gnu
      - test:x86_64-unknown-linux-gnu
      - test:x86_64-apple-darwin
      - test:aarch64-apple-darwin
      - test:x86_64-pc-windows-msvc
      - test:aarch64-pc-windows-msvc

  # ---------------------------------------------------------------------------
  # build
  # ---------------------------------------------------------------------------
  # Shared configuration for every per-target build task. `{{ args.profile }}`
  # is supplied by the release/debug leaf tasks that extend the per-target
  # templates below.
  build-base:
    base: true
    args:
      profile: release
    dependencies:
      - ^build
    cache:
      key:
        env:
          append: [RUST_BUILD_ADDITIONAL_ARGS]

  # Per-target templates: everything target-specific lives here, parameterized
  # on `{{ args.profile }}`, so the release/debug leaves only pick a profile.
  build:aarch64-unknown-linux-gnu-base:
    base: true
    extends: [build-base]
    enabled: "{{ env.RUST_TARGET is defined and env.RUST_TARGET is containing(pat='aarch64-unknown-linux-gnu') }}"
    exec: cross build --profile {{ args.profile }} --target aarch64-unknown-linux-gnu -p ${PROJECT_NAME} ${RUST_BUILD_ADDITIONAL_ARGS:-}
    dependencies:
      append: [test:aarch64-unknown-linux-gnu]
    cache:
      key:
        files:
          append: ["@workspace/Cross.toml"]
      output:
        files:
          - "@workspace/target/aarch64-unknown-linux-gnu/{{ args.profile }}/{{ env.PROJECT_NAME }}"

  build:x86_64-unknown-linux-gnu-base:
    base: true
    extends: [build-base]
    enabled: "{{ env.RUST_TARGET is defined and env.RUST_TARGET is containing(pat='x86_64-unknown-linux-gnu') }}"
    exec: cargo build --profile {{ args.profile }} --target x86_64-unknown-linux-gnu -p ${PROJECT_NAME} ${RUST_BUILD_ADDITIONAL_ARGS:-}
    dependencies:
      append: [test:x86_64-unknown-linux-gnu]
    cache:
      output:
        files:
          - "@workspace/target/x86_64-unknown-linux-gnu/{{ args.profile }}/{{ env.PROJECT_NAME }}"

  build:x86_64-apple-darwin-base:
    base: true
    extends: [build-base]
    enabled: "{{ env.RUST_TARGET is defined and env.RUST_TARGET is containing(pat='x86_64-apple-darwin') }}"
    exec: cargo build --profile {{ args.profile }} --target x86_64-apple-darwin -p ${PROJECT_NAME} ${RUST_BUILD_ADDITIONAL_ARGS:-}
    dependencies:
      append: [test:x86_64-apple-darwin]
    cache:
      output:
        files:
          - "@workspace/target/x86_64-apple-darwin/{{ args.profile }}/{{ env.PROJECT_NAME }}"

  build:aarch64-apple-darwin-base:
    base: true
    extends: [build-base]
    enabled: "{{ env.RUST_TARGET is defined and env.RUST_TARGET is containing(pat='aarch64-apple-darwin') }}"
    exec: cargo build --profile {{ args.profile }} --target aarch64-apple-darwin -p ${PROJECT_NAME} ${RUST_BUILD_ADDITIONAL_ARGS:-}
    dependencies:
      append: [test:aarch64-apple-darwin]
    cache:
      output:
        files:
          - "@workspace/target/aarch64-apple-darwin/{{ args.profile }}/{{ env.PROJECT_NAME }}"

  build:x86_64-pc-windows-msvc-base:
    base: true
    extends: [build-base]
    enabled: "{{ env.RUST_TARGET is defined and env.RUST_TARGET is containing(pat='x86_64-pc-windows-msvc') }}"
    exec: cargo build --profile {{ args.profile }} --target x86_64-pc-windows-msvc -p ${PROJECT_NAME} ${RUST_BUILD_ADDITIONAL_ARGS:-}
    dependencies:
      append: [test:x86_64-pc-windows-msvc]
    cache:
      output:
        files:
          - "@workspace/target/x86_64-pc-windows-msvc/{{ args.profile }}/{{ env.PROJECT_NAME }}.exe"

  build:aarch64-pc-windows-msvc-base:
    base: true
    extends: [build-base]
    enabled: "{{ env.RUST_TARGET is defined and env.RUST_TARGET is containing(pat='aarch64-pc-windows-msvc') }}"
    exec: cargo build --profile {{ args.profile }} --target aarch64-pc-windows-msvc -p ${PROJECT_NAME} ${RUST_BUILD_ADDITIONAL_ARGS:-}
    dependencies:
      append: [test:aarch64-pc-windows-msvc]
    cache:
      output:
        files:
          - "@workspace/target/aarch64-pc-windows-msvc/{{ args.profile }}/{{ env.PROJECT_NAME }}.exe"

  build:current-base:
    base: true
    extends: [build-base]
    enabled: "{{ env.RUST_TARGET is undefined or env.RUST_TARGET == '' }}"
    exec: cargo build --profile {{ args.profile }} -p ${PROJECT_NAME} ${RUST_BUILD_ADDITIONAL_ARGS:-}
    dependencies:
      append: [test:current]
    cache:
      output:
        files:
          - "@workspace/target/{{ args.profile }}/{{ env.PROJECT_NAME }}"
          - "@workspace/target/{{ args.profile }}/{{ env.PROJECT_NAME }}.exe"

  # Release leaves -------------------------------------------------------------
  build:aarch64-unknown-linux-gnu:
    extends: [build:aarch64-unknown-linux-gnu-base]
    args:
      profile: release

  build:x86_64-unknown-linux-gnu:
    extends: [build:x86_64-unknown-linux-gnu-base]
    args:
      profile: release

  build:x86_64-apple-darwin:
    extends: [build:x86_64-apple-darwin-base]
    args:
      profile: release

  build:aarch64-apple-darwin:
    extends: [build:aarch64-apple-darwin-base]
    args:
      profile: release

  build:x86_64-pc-windows-msvc:
    extends: [build:x86_64-pc-windows-msvc-base]
    args:
      profile: release

  build:aarch64-pc-windows-msvc:
    extends: [build:aarch64-pc-windows-msvc-base]
    args:
      profile: release

  build:current:
    extends: [build:current-base]
    args:
      profile: release

  build:
    exec: ""
    cache:
      output:
        files:
          - "@workspace/target/release/{{ env.PROJECT_NAME }}"
          - "@workspace/target/release/{{ env.PROJECT_NAME }}.exe"
          - "@workspace/target/*/release/{{ env.PROJECT_NAME }}"
          - "@workspace/target/*/release/{{ env.PROJECT_NAME }}.exe"
    dependencies:
      - test
      - ^build
      - build:current
      - build:aarch64-unknown-linux-gnu
      - build:x86_64-unknown-linux-gnu
      - build:x86_64-apple-darwin
      - build:aarch64-apple-darwin
      - build:x86_64-pc-windows-msvc
      - build:aarch64-pc-windows-msvc

  # Debug leaves ---------------------------------------------------------------
  build:debug:aarch64-unknown-linux-gnu:
    extends: [build:aarch64-unknown-linux-gnu-base]
    args:
      profile: debug

  build:debug:x86_64-unknown-linux-gnu:
    extends: [build:x86_64-unknown-linux-gnu-base]
    args:
      profile: debug

  build:debug:x86_64-apple-darwin:
    extends: [build:x86_64-apple-darwin-base]
    args:
      profile: debug

  build:debug:aarch64-apple-darwin:
    extends: [build:aarch64-apple-darwin-base]
    args:
      profile: debug

  build:debug:x86_64-pc-windows-msvc:
    extends: [build:x86_64-pc-windows-msvc-base]
    args:
      profile: debug

  build:debug:aarch64-pc-windows-msvc:
    extends: [build:aarch64-pc-windows-msvc-base]
    args:
      profile: debug

  build:debug:current:
    extends: [build:current-base]
    args:
      profile: debug

  build:debug:
    exec: ""
    cache:
      output:
        files:
          - "@workspace/target/debug/{{ env.PROJECT_NAME }}"
          - "@workspace/target/debug/{{ env.PROJECT_NAME }}.exe"
          - "@workspace/target/*/debug/{{ env.PROJECT_NAME }}"
          - "@workspace/target/*/debug/{{ env.PROJECT_NAME }}.exe"
    dependencies:
      - test
      - ^build
      - build:debug:current
      - build:debug:aarch64-unknown-linux-gnu
      - build:debug:x86_64-unknown-linux-gnu
      - build:debug:x86_64-apple-darwin
      - build:debug:aarch64-apple-darwin
      - build:debug:x86_64-pc-windows-msvc
      - build:debug:aarch64-pc-windows-msvc

meta:
  targets:
    x86_64-unknown-linux-gnu:
      runner: ubuntu-latest
    aarch64-unknown-linux-gnu:
      runner: ubuntu-latest
    x86_64-apple-darwin:
      runner: macos-latest
    aarch64-apple-darwin:
      runner: macos-latest
    x86_64-pc-windows-msvc:
      runner: windows-2022
    # disabled for now, can cross compile but can't cross test on windows-latest runner since it doesn't support native emulation of aarch64 binaries
    # aarch64-pc-windows-msvc:
    #   runner: windows-2022
