# yaml-language-server: $schema=https://raw.githubusercontent.com/omni-oss/json-schemas/refs/heads/main/project.json
name: rust-cli

extends:
  - ./rust.omni.yaml

tasks:
  build-base:
    base: true
    exec: cargo build --profile {{ args.profile }} --package ${PROJECT_NAME} ${RUST_BUILD_ADDITIONAL_ARGS:-}
    args:
      profile: release
    cache:
      key:
        env:
          append: [RUST_BUILD_ADDITIONAL_ARGS]
      output:
        files:
          append:
            - "@workspace/target/{{ args.profile }}/{{ env.PROJECT_NAME }}"
            - "@workspace/target/{{ args.profile }}/{{ env.PROJECT_NAME }}.exe"
    dependencies:
      - test

  build:
    extends: [build-base]
    args:
      profile: release

  build:debug:
    extends: [build-base]
    args:
      profile: debug

  install:
    cache:
      enabled: false
    exec: cargo install --path .
    dependencies:
      - test

meta:
  type: cli
  release:
    github: true
