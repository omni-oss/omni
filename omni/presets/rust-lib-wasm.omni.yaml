# yaml-language-server: $schema=https://raw.githubusercontent.com/omni-oss/json-schemas/refs/heads/main/project.json
name: rust-lib

extends:
  - "./rust-lib.omni.yaml"

tasks:
  build:
    exec: sh ${WORKSPACE_DIR}/omni/scripts/wasm-pack-build.sh
    cache:
      key:
        env:
          append: [WASM_PACK_NO_OPT]
        files:
          append:
            - "@workspace/omni/scripts/wasm-pack-build.sh"
      output:
        files:
          - "dist/**"

meta:
  type: lib
  arch: wasm
