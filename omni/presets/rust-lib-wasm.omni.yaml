# yaml-language-server: $schema=https://raw.githubusercontent.com/omni-oss/json-schemas/refs/heads/main/project.json
name: rust-lib

extends:
  - "./rust-lib.omni.yaml"

tasks:
  build:
    exec: >-
      sh -c 'case "${WASM_PACK_NO_OPT:-}" in 1|true|TRUE|True|yes) set -- --no-opt;; *) set --;; esac;
      exec wasm-pack build --target nodejs --out-name index --out-dir ./dist "$@"'
    cache:
      key:
        env:
          append: [WASM_PACK_NO_OPT]
      output:
        files:
          - "dist/**"

meta:
  type: lib
  arch: wasm
